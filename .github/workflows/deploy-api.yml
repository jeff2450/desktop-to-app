name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t $ECR_REGISTRY/webtoapp-api:$IMAGE_TAG \
            -t $ECR_REGISTRY/webtoapp-api:latest \
            .
          docker push $ECR_REGISTRY/webtoapp-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/webtoapp-api:latest
          echo "image=$ECR_REGISTRY/webtoapp-api:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql $DATABASE_URL < apps/api/src/db/migrations/001_init.sql

      - name: Update ECS service
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs update-service \
            --cluster webtoapp-prod \
            --service webtoapp-api \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster webtoapp-prod \
            --services webtoapp-api \
            --region ${{ secrets.AWS_REGION }}

      - name: Health check
        run: |
          sleep 10
          curl -f ${{ secrets.API_URL }}/api/health || exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::API deployment failed — check ECS logs"
