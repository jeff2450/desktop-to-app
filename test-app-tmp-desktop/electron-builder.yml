appId: com.example.pharmacytracker
productName: Pharmacy Tracker
copyright: Copyright © 2024

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - electron/**/*
  - backend/**/*
  - package.json

extraResources:
  - from: backend/
    to: backend/
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/icon.png
  category: Utility

publish:
  provider: generic
  url: https://your-update-server.com/updates/

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: assets/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
