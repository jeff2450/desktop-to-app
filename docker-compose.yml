version: "3.9"

# ────────────────────────────────────────────────────────────────────────────
# WebToApp — docker-compose (development + CI)
#
# Services:
#   postgres  — PostgreSQL 16
#   redis     — Redis 7
#   api       — Express + BullMQ API (apps/api)
#   worker    — BullMQ conversion worker (same image, different command)
#   web       — Next.js SaaS dashboard (apps/web)
# ────────────────────────────────────────────────────────────────────────────

services:
  # ── Postgres ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-webtoapp}
      POSTGRES_USER:     ${POSTGRES_USER:-webtoapp}
      # Set POSTGRES_PASSWORD in .env for production (default is for local dev only)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_change_me_in_prod}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtoapp"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context:    .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      # Persist uploads and outputs across container restarts in dev
      - api_uploads:/app/uploads
      - api_outputs:/app/outputs
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 15s

  # ── Worker ─────────────────────────────────────────────────────────────────
  worker:
    build:
      context:    .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/workers/conversion.worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file: .env
    volumes:
      - api_uploads:/app/uploads
      - api_outputs:/app/outputs
      # electron-builder needs write access to /tmp inside container
      - worker_tmp:/tmp

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  web:
    build:
      context:    .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env.web
    ports:
      - "3000:3000"
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  api_uploads:
  api_outputs:
  worker_tmp:
